apiVersion: apps/v1
kind: Deployment
metadata:
  name: true-lable-backend
  labels:
    app: true-lable-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: true-lable-backend
  template:
    metadata:
      labels:
        app: true-lable-backend
    spec:
      containers:
        - name: backend
          image: true-lable-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
