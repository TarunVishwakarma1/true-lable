apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-true-lable
  labels:
    app: db-true-lable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-true-lable
  template:
    metadata:
      labels:
        app: db-true-lable
    spec:
      containers:
      - name: db-true-lable
        image: postgres:17
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5432
        env: 
          - name: POSTGRES_USER
            value: postgres
          - name: POSTGRES_PASSWORD
            value: postgres
          - name: POSTGRES_DB
            value: postgres
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        volumeMounts: 
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim: 
          claimName: db-pvc
