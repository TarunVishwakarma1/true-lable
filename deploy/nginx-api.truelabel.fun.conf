# /etc/nginx/sites-available/api.truelabel.fun
#
# Rate and connection limit zones (zone=api and zone=perip) are defined at the
# http{} level in /etc/nginx/conf.d/limits.conf (or see deploy/nginx-limits.conf):
#
#   limit_req_zone  $binary_remote_addr zone=api:10m rate=20r/s;
#   limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.truelabel.fun;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.truelabel.fun;

    ssl_certificate     /etc/letsencrypt/live/api.truelabel.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.truelabel.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Don't advertise a version to anyone scanning for a known CVE.
    server_tokens off;

    # The app rejects bodies over 256 KB anyway; doing it here means an
    # oversized upload never reaches a worker at all.
    client_max_body_size  256k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;

    # A client that can neither send nor read at a reasonable pace is dropped
    # rather than left holding a connection. This is what stops a slow client
    # exhausting the server with no volume behind it at all.
    limit_req  zone=api burst=60 nodelay;
    limit_conn perip 20;

    # The application sets Cache-Control, HSTS, CSP, nosniff, X-Frame-Options
    # and Referrer-Policy on every response. Adding them here as well would
    # send each one twice, which some clients treat as malformed.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Appends the address nginx actually saw to whatever the client sent.
        # That last entry is the only one a caller cannot write, and it is
        # precisely the one TRUSTED_PROXY_HOPS=1 tells the app to read. Do not
        # change this without re-reading that setting.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Longer than the app's own 25s ceiling, so a timeout is reported by
        # the service that owns the work rather than guessed at by nginx.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
