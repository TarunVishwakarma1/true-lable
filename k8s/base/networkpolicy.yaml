# Default-deny for the data tier.
#
# Without this, any pod that lands in the namespace — a compromised sidecar, a
# debug container someone left running — can open a socket to Postgres or
# Redis directly. Those hold every product row, every profile and every device
# token hash, and neither speaks TLS inside the cluster.
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, or the managed
# equivalent). On a CNI that ignores policy this file is silently inert, which
# is worth checking rather than assuming.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-backend-only
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-backend-only
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 6379
