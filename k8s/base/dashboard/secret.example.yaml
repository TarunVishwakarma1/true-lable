# Template only — NOT applied by kustomization.yaml, NOT real credentials.
# The real `dashboard-secrets` object is created/updated at deploy time by
# .github/workflows/ci-cd.yml from GitHub Actions secrets, via:
#   kubectl create secret generic dashboard-secrets \
#     --from-literal=DATABASE_URL=... \
#     --dry-run=client -o yaml | kubectl apply -f -
# so real values never touch git. To create it by hand against a cluster
# (first-time setup, or a manual/local deploy), copy this file, fill in a
# real value, and `kubectl apply -f` it — never commit that copy.
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secrets
type: Opaque
stringData:
  # Same database the backend uses — Prisma queries it read-only for typed
  # dashboard views. Same Neon connection string as backend-secrets'
  # DATABASE_URL (see backend/secret.example.yaml).
  DATABASE_URL: "postgresql://CHANGE_ME"
