apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  APP_ENV: "production"
  MAX_DB_CONNECTIONS: "10"
  MAX_REDIS_CONNECTIONS: "10"
  RUST_LOG: "info"

  # How many proxies sit in front of this process, and therefore how much of
  # X-Forwarded-For was written by them rather than by the caller.
  #
  # MUST stay 0 until an ingress is actually in front. Everything to the left
  # of what your own proxies appended is attacker-supplied, so a non-zero
  # value with no proxy present hands every caller its own rate-limit bucket
  # — worse than not reading the header at all.
  #
  # Count the hops that append to the header, outermost first:
  #   ingress-nginx only ............... 1
  #   CDN (Cloudflare etc.) + ingress .. 2
  # An L4 / TCP load balancer does not append and does not count — DO's Load
  # Balancer in front of ingress-nginx is exactly that, so ingress-nginx is
  # the only hop.
  TRUSTED_PROXY_HOPS: "1"

  # The backend Service is ClusterIP (see backend/service.yaml) — nothing
  # outside the cluster can reach this pod's :8080 directly no matter what
  # interface it binds, so SERVER_HOST=0.0.0.0 here isn't "public exposure"
  # the way it would be on a bare VM. Tells warn_about_exposure() to trust
  # that instead of inferring reachability from SERVER_HOST, which would
  # otherwise false-positive an ERROR log on every boot.
  TRUST_CONTAINER_NETWORK: "true"

  # Browser origins permitted to call the API. The iOS client sends no
  # Origin, so it's unaffected either way. Only the dashboard actually calls
  # this API from a browser — truelabel.fun (marketing) and docs.truelabel.fun
  # are both static content with no backend calls, so neither is listed here.
  ALLOWED_ORIGINS: "https://dashboard.truelabel.fun"

  # `owner/repo` the dashboard's "publish as GitHub issue" button files
  # against. Not secret by itself — GITHUB_TOKEN (the actual credential) is
  # in backend-secrets, not here. Leaving this unset (or GITHUB_TOKEN unset)
  # just makes that one button fail with a clear error; nothing else breaks.
  GITHUB_REPO: "TarunVishwakarma1/true-lable"

  # Lets a filed GitHub issue link back to the crash report it came from.
  DASHBOARD_URL: "https://dashboard.truelabel.fun"
