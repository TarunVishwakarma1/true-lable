# Template only — NOT applied by kustomization.yaml, NOT real credentials.
# The real `backend-secrets` object is created/updated at deploy time by
# .github/workflows/ci-cd.yml from GitHub Actions secrets, via:
#   kubectl create secret generic backend-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=REDIS_URL=... \
#     --dry-run=client -o yaml | kubectl apply -f -
# so real values never touch git. To create it by hand against a cluster
# (first-time setup, or a manual/local deploy), copy this file, fill in
# real values, and `kubectl apply -f` it — never commit that copy.
#
# Both point at external managed services today (Neon Postgres, Upstash
# Redis) — nothing in this cluster runs a database. `redis`'s Cargo features
# already include TLS (tls-rustls-webpki-roots), so Upstash's `rediss://`
# just works with no code change. Migrating to self-hosted bare metal later
# means changing these two values only — the app only ever reads
# DATABASE_URL/REDIS_URL, never anything provider-specific.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGE_ME.neon.tech/truelabel?sslmode=require"
  REDIS_URL: "rediss://CHANGE_ME.upstash.io:6379"
