apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  # ClusterIP, not LoadBalancer: the ingress (see ../ingress.yaml) is the one
  # public entry point for every app, fronted by a single DO Load Balancer
  # that ingress-nginx's own Service provisions. One LB for four hostnames
  # instead of one per app.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
