# Requires cert-manager itself to already be installed in the cluster (Helm,
# one-time — see docs/deployment.mdx). This CR is what tells it *how* to get
# certs: ACME/Let's Encrypt via HTTP-01, solved through the same ingress-nginx
# that routes real traffic (no DNS-provider API key needed). Portable as-is
# to a future bare-metal cluster — nothing DigitalOcean-specific here.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Let's Encrypt only uses this for expiry/problem notices, never a login.
    email: tarunvishwakarma81@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
