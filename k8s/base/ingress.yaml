# Not applied by default (see kustomization.yaml) — backend/web are already
# reachable via their own LoadBalancer Services without any of this. Add
# this to kustomization.yaml's `resources:` once you have a real domain and
# an ingress controller (e.g. ingress-nginx) installed in the cluster, and
# replace the two placeholder hosts below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: true-label
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # The app caps bodies at 256 KB; reject anything larger at the edge so it
    # never reaches a worker.
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"

    # Slow-loris defence: a client that cannot send or read at a reasonable
    # pace is dropped rather than allowed to hold a connection.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/client-body-timeout: "10"
    nginx.ingress.kubernetes.io/client-header-timeout: "10"

    # A first line of volumetric defence. The application limits per device
    # and per address as well, but that costs a Redis round trip; this costs
    # nothing and never reaches the app. Genuine volumetric DDoS still has to
    # be absorbed upstream of the cluster — a CDN or scrubbing provider — no
    # amount of application code substitutes for that.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Once this ingress is applied, set TRUSTED_PROXY_HOPS in
    # backend-config to the number of proxies appending to X-Forwarded-For.
    # With this ingress and nothing else in front, that is 1.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
        - app.example.com
      secretName: true-label-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
