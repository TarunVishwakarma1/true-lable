# The one public entry point for all four apps, fronted by a single DO Load
# Balancer that ingress-nginx's own Service provisions. Requires, cluster-side
# (one-time, not managed by this kustomization — see docs/deployment.mdx):
#   - ingress-nginx (the controller these annotations/ingressClassName target)
#   - cert-manager, plus the ClusterIssuer in
#     k8s/base/cert-manager/cluster-issuer.yaml (applied standalone, once —
#     see that file's own header comment for why it's not in any
#     kustomization's resources list)
#
# Both are portable to any k8s cluster (DOKS today, a home bare-metal cluster
# later) — nothing here is DigitalOcean-specific except the DNS records
# pointing at whatever address the DO Load Balancer gets, which is the one
# thing that has to change on a move.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: true-label
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # The app caps bodies at 256 KB; reject anything larger at the edge so it
    # never reaches a worker.
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"

    # Slow-loris defence: a client that cannot send or read at a reasonable
    # pace is dropped rather than allowed to hold a connection.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/client-body-timeout: "10"
    nginx.ingress.kubernetes.io/client-header-timeout: "10"

    # A first line of volumetric defence. The application limits per device
    # and per address as well, but that costs a Redis round trip; this costs
    # nothing and never reaches the app. Genuine volumetric DDoS still has to
    # be absorbed upstream of the cluster — a CDN or scrubbing provider — no
    # amount of application code substitutes for that.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # With this ingress and nothing else in front, TRUSTED_PROXY_HOPS in
    # backend-config must be 1 — see that file's comment.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - truelabel.fun
        - api.truelabel.fun
        - dashboard.truelabel.fun
        - docs.truelabel.fun
      secretName: true-label-tls
  rules:
    - host: api.truelabel.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
    - host: truelabel.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: dashboard.truelabel.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
    - host: docs.truelabel.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 80
