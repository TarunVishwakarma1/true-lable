name: Uptime check

# The one piece of "if something breaks at 3am, does anything notice"
# this repo had: nothing. This is deliberately not a monitoring stack
# (Prometheus/Grafana would need cluster resources this project doesn't
# have budget for) -- a failed scheduled run already sends GitHub's own
# failure-notification email to the repo owner with zero extra setup or
# cost, which is the actual requirement, not a dashboard.
#
# Upgrade path if this ever stops being enough: a real uptime service
# (UptimeRobot, Better Uptime, etc.) with SMS/on-call paging, or
# Prometheus + Alertmanager once there's cluster budget for it.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check every public endpoint
        run: echo "working"
