name: 🐛 Bug report
description: Something in the backend, iOS app, or web app is broken.
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where is the bug?
      options:
        - Backend (Rust API)
        - iOS app
        - Web (marketing site)
        - Docs site
        - Deployment / infra
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan barcode ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: iOS version/device, backend commit or deployed version, browser, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
    validations:
      required: false
